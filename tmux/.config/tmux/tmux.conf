# Help popup with all keybinds
bind-key ? display-popup -E 'tmux list-keys | fzf --reverse --ansi | cut -f 2 | xargs -I % tmux display-message "%"'

# Set the control character to Ctrl+Spacebar (instead of Ctrl+B)
set -g prefix C-space
unbind-key C-b
bind-key C-space send-prefix

##########################################################
# Tmux plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
##########################################################

set -g default-terminal "tmux-256color"

# Move status bar to the top
set -g status-position top

# Start windows and panes index at 1, not 0.
set -g base-index 1
setw -g pane-base-index 1
set -g escape-time 0

# Re-number windows
set -g renumber-windows on

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Enable mouse mode
set -g mouse on

# tmux-yank config
set -g @yank_selection_mouse 'clipboard'
set -s copy-command 'wl-copy'
set -g set-clipboard on
set -g @yank_selection 'primary'
set -g @yank_action 'copy-pipe-no-clear'

# catppuccin config
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_status_modules_right "gitmux directory cpu battery date_time"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_date_time_text "%d %h %H:%M"

# Reload the config file with <prefix> + r
unbind r
bind r source-file "$XDG_CONFIG_HOME/tmux/tmux.conf" \; display "Config reload"

# Init TPM
run '~/.config/tmux/plugins/tpm/tpm'
